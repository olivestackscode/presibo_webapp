<script>
/* ================================
   MOCK DEVICE DATA
================================ */

const MOCK_DEVICE = {
  name: "Presibo BP Monitor",
  status: "Connected",
  battery: 82
};

const MOCK_HISTORY = [
  {
    systolic: 118,
    diastolic: 76,
    displayTime: "Today, 2:14 PM"
  },
  {
    systolic: 121,
    diastolic: 79,
    displayTime: "Today, 9:32 AM"
  },
  {
    systolic: 124,
    diastolic: 81,
    displayTime: "Yesterday, 7:48 PM"
  },
  {
    systolic: 117,
    diastolic: 75,
    displayTime: "Yesterday, 8:15 AM"
  },
  {
    systolic: 126,
    diastolic: 83,
    displayTime: "Aug 8, 2026, 6:42 PM"
  },
  {
    systolic: 120,
    diastolic: 78,
    displayTime: "Aug 8, 2026, 8:05 AM"
  },
  {
    systolic: 128,
    diastolic: 84,
    displayTime: "Aug 7, 2026, 7:21 PM"
  },
  {
    systolic: 119,
    diastolic: 77,
    displayTime: "Aug 7, 2026, 8:11 AM"
  },
  {
    systolic: 122,
    diastolic: 80,
    displayTime: "Aug 6, 2026, 7:36 PM"
  },
  {
    systolic: 116,
    diastolic: 74,
    displayTime: "Aug 6, 2026, 8:03 AM"
  }
];


/* ================================
   LOAD MOCK DEVICE
================================ */

function loadMockDevice() {

  document.getElementById("deviceName").textContent =
    MOCK_DEVICE.name;

  document.getElementById("connectionStatus").textContent =
    MOCK_DEVICE.status;

  document.getElementById("connectionDot").className =
    "w-2 h-2 rounded-full bg-green-500";

}


/* ================================
   SHOW MOCK LATEST READING
================================ */

function loadMockLatestReading() {

  const latest = MOCK_HISTORY[0];

  document.getElementById("resultCard")
    .classList.remove("hidden");

  document.getElementById("systolic").textContent =
    latest.systolic;

  document.getElementById("diastolic").textContent =
    latest.diastolic;

  document.getElementById("systolicSmall").textContent =
    `${latest.systolic} mmHg`;

  document.getElementById("diastolicSmall").textContent =
    `${latest.diastolic} mmHg`;

  document.getElementById("resultTime").textContent =
    latest.displayTime;

  updateBPStatus(
    latest.systolic,
    latest.diastolic
  );

}


/* ================================
   MOCK HISTORY
================================ */

function loadMockHistory() {

  const list =
    document.getElementById("historyList");

  const empty =
    document.getElementById("emptyHistory");

  list.innerHTML = "";

  empty.classList.add("hidden");


  MOCK_HISTORY.forEach((reading, index) => {

    const status =
      getBPStatus(
        reading.systolic,
        reading.diastolic
      );


    const row =
      document.createElement("div");

    row.className =
      "py-4 flex items-center justify-between";


    row.innerHTML = `

      <div class="flex items-center gap-3">

        <div class="w-10 h-10 rounded-full bg-purple-50
                    flex items-center justify-center">

          <i class="fas fa-heart-pulse text-purple-700"></i>

        </div>


        <div>

          <div class="font-bold text-gray-900">

            ${reading.systolic}/${reading.diastolic}

            <span class="text-xs font-normal text-gray-400">
              mmHg
            </span>

          </div>

          <div class="text-xs text-gray-500 mt-1">
            ${reading.displayTime}
          </div>

        </div>

      </div>


      <span class="${status.classes}
                   px-2.5 py-1
                   rounded-full
                   text-xs
                   font-semibold">

        ${status.label}

      </span>

    `;


    list.appendChild(row);

  });

}


/* ================================
   MOCK SCAN
================================ */

function startScan() {

  const scanCard =
    document.getElementById("scanningCard");

  scanCard.classList.remove("hidden");


  document.getElementById("scanMessage")
    .textContent =
    "Presibo BP Monitor found. Connecting...";


  document.getElementById("scanBtn")
    .disabled = true;


  let seconds = 30;


  document.getElementById("timerText")
    .textContent = "30s";


  document.getElementById("progressBar")
    .style.width = "0%";


  const timer =
    setInterval(() => {

      seconds--;


      document.getElementById("timerText")
        .textContent =
        `${seconds}s`;


      const progress =
        ((30 - seconds) / 30) * 100;


      document.getElementById("progressBar")
        .style.width =
        `${progress}%`;


      if (seconds <= 0) {

        clearInterval(timer);

        document.getElementById("scanMessage")
          .textContent =
          "Reading received successfully.";


        setTimeout(() => {

          scanCard.classList.add("hidden");

          document.getElementById("scanBtn")
            .disabled = false;

          loadMockLatestReading();

        }, 700);

      }

    }, 1000);

}


/* ================================
   INITIALIZE MOCK PAGE
================================ */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadMockDevice();

    loadMockLatestReading();

    loadMockHistory();

  }
);
</script>
