<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vital Signs Monitor | Presibo</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --pulse-color: #3b82f6;
            --doctor-bg: #f0fdf4;
            --doctor-border: #bbf7d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 520px;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
        }

        .status-dot.scanning {
            background-color: var(--pulse-color);
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse 1.5s infinite;
        }

        .status-dot.ready {
            background-color: #10b981;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .scan-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 0;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-view {
            display: none;
        }

        .patient-info {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .patient-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .patient-name {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .timestamp {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .vital-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .vital-box-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .vital-box-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .vital-box-unit {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .analysis-section {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .analysis-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e40af;
            margin-bottom: 6px;
        }

        .analysis-text {
            font-size: 0.95rem;
            color: #1e3a8a;
            line-height: 1.5;
        }

        .doctor-box {
            background: var(--doctor-bg);
            border: 1px solid var(--doctor-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .doctor-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            border: 2px solid #86efac;
            font-weight: 700;
            color: #15803d;
        }

        .doctor-details {
            flex-grow: 1;
        }

        .doctor-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #15803d;
            margin-bottom: 2px;
        }

        .doctor-name {
            font-size: 1rem;
            font-weight: 700;
            color: #14532d;
        }

        .doctor-meta {
            font-size: 0.85rem;
            color: #166534;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .doctor-contact {
            font-size: 0.8rem;
            color: #047857;
            margin-top: 2px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1 class="title">Device Sync</h1>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Idle</span>
        </div>
    </div>

    <!-- SCANNING STATE -->
    <div class="scan-view" id="scanView">
        <div class="spinner"></div>
        <h3 style="margin-bottom: 8px;">Waiting for device...</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Please connect sensor or perform reading</p>
    </div>

    <!-- RESULTS & DOCTOR PAIRING DISPLAY -->
    <div class="results-view" id="resultsView">
        <div class="patient-info">
            <div class="patient-label">Patient Record</div>
            <div class="patient-name" id="resPatientName">--</div>
            <div class="timestamp" id="resTimestamp">--</div>
        </div>

        <div class="vitals-grid">
            <div class="vital-box">

            </div>
            <div class="vital-box">

                <div class="vital-box-value" id="resSugar">--</div>
                <span class="vital-box-unit">mg/dL</span>
            </div>
        </div>

        <div class="analysis-section">
            <div class="analysis-title">Clinical Analysis & Advice</div>
            <p class="analysis-text" id="resEvaluation">--</p>
        </div>

        <!-- Matched Doctor Card -->
        <div class="doctor-box">
            <div class="doctor-avatar" id="docAvatar">🩺</div>
            <div class="doctor-details">
                <div class="doctor-badge">Assigned Physician</div>
                <div class="doctor-name" id="docName">Finding doctor...</div>
                <div class="doctor-meta">

                    <span id="docLocation"></span>
                </div>
                <div class="doctor-contact" id="docContact"></div>
            </div>
        </div>

        <button class="btn" id="btnNewReading">New Reading</button>
    </div>
</div>

    function setStatus(text, stateClass) {
        statusText.innerText = text;
        statusDot.className = 'status-dot ' + (stateClass || '');
    }

    async function loadDoctors() {
        try {
            const res = await fetch(DOCTORS_API_URL, { cache: "no-store" });
            if (res.ok) {
                const data = await res.json();
                const fetched = Array.isArray(data) ? data : (data.doctors || []);
                if (fetched.length > 0) {
                    doctorsList = fetched;
                }
            }
        } catch (err) {
            console.log("Using built-in doctors fallback roster.");
        }
    }

    function pairDoctor(record) {
        const sugar = parseFloat(record.sugar) || 0;
        let matched = null;

        // Route to Nutritionist/Diet specialist if blood sugar reading exists and is abnormal
        if (sugar >= 140 || (sugar > 0 && sugar < 70)) {
            matched = doctorsList.find(d => (d.specialization || d.specialty || '').toLowerCase().includes('nutrition'));
        }

        // Route to Family Medicine / Senior General Practitioner for elevated readings
        if (!matched) {
            matched = doctorsList.find(d => (d.specialization || d.specialty || '').toLowerCase().includes('family'));
        }

        // Fallback: Pick top physician by experience/cases
        if (!matched) {
            matched = doctorsList[0];
        }

        // Construct display name
        const names = [matched.firstname, matched.midname, matched.lastname].filter(Boolean).join(' ');
        const fullName = names.startsWith('Dr.') ? names : `Dr. ${names}`;

        docName.innerText = fullName;
        docSpecialty.innerText = matched.specialization || matched.specialty || 'General Practitioner';
        docLocation.innerText = `• ${matched.location || 'Nigeria'}`;
        docContact.innerText = `Tel: ${matched.phone || 'N/A'} | ${matched.email || ''}`;

        // Generate initials avatar
        const initials = `${(matched.firstname || '')[0] || ''}${(matched.lastname || '')[0] || ''}`.toUpperCase();
        docAvatar.innerText = initials || '🩺';
    }

    async function fetchLatestRecord() {
        try {
            const response = await fetch(DEVICES_API_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("Network response was not OK");
            
            const result = await response.json();
            if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                return result.data[0];
            }
            return null;
        } catch (err) {
            console.error("API Read Error:", err);
            return null;
        }
    }

    function renderRecord(record) {
        resPatientName.innerText = `${record.first_name || 'Patient'} ${record.last_name || ''}`.trim();
        resTimestamp.innerText = `Recorded: ${record.datetime || 'Just now'}`;
        resBp.innerText = `${record.bp_sys || '--'}/${record.bp_dia || '--'}`;
        resSugar.innerText = record.sugar ? `${record.sugar}` : 'N/A';
        resEvaluation.innerText = record.evaluation || 'Vital signs logged successfully.';

        pairDoctor(record);

        scanView.style.display = 'none';
        resultsView.style.display = 'block';
        setStatus("Reading Complete", "ready");
    }

    async function startScan() {
        clearInterval(pollTimer);
        
        resultsView.style.display = 'none';
        scanView.style.display = 'flex';
        setStatus("Scanning...", "scanning");

        const currentRecord = await fetchLatestRecord();
        initialLastRecordId = currentRecord ? currentRecord.id : null;

        pollTimer = setInterval(async () => {
            const latest = await fetchLatestRecord();
            if (latest && (!initialLastRecordId || latest.id !== initialLastRecordId)) {
                clearInterval(pollTimer);
                renderRecord(latest);
            }
        }, POLL_INTERVAL);
    }

    btnNewReading.addEventListener('click', startScan);

    window.addEventListener('DOMContentLoaded', async () => {
        await loadDoctors();
        startScan();
    });
</script>

</body>
</html>
