<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vital Signs Monitor | Presibo</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --pulse-color: #3b82f6;
            --doctor-bg: #f0fdf4;
            --doctor-border: #bbf7d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 520px;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
        }

        .status-dot.scanning {
            background-color: var(--pulse-color);
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse 1.5s infinite;
        }

        .status-dot.ready {
            background-color: var(--success);
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .scan-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 0;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-view {
            display: none;
        }

        .patient-info {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .patient-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .patient-name {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .timestamp {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .vital-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .vital-box-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .vital-box-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .vital-box-unit {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .analysis-section {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .analysis-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e40af;
            margin-bottom: 6px;
        }

        .analysis-text {
            font-size: 0.95rem;
            color: #1e3a8a;
            line-height: 1.5;
        }

        /* Doctor Pairing Box */
        .doctor-box {
            background: var(--doctor-bg);
            border: 1px solid var(--doctor-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .doctor-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            border: 2px solid #86efac;
            font-weight: 700;
            color: #15803d;
        }

        .doctor-details {
            flex-grow: 1;
        }

        .doctor-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #15803d;
            margin-bottom: 2px;
        }

        .doctor-name {
            font-size: 1rem;
            font-weight: 700;
            color: #14532d;
        }

        .doctor-meta {
            font-size: 0.85rem;
            color: #166534;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .booking-status {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        .booking-status.success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .booking-status.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--success);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--success-hover);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1 class="title">Device Sync</h1>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Idle</span>
        </div>
    </div>

    <!-- SCANNING VIEW -->
    <div class="scan-view" id="scanView">
        <div class="spinner"></div>
        <h3 style="margin-bottom: 8px;">Waiting for device...</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Please connect sensor or perform reading</p>
    </div>

    <!-- RESULTS & BOOKING DISPLAY -->
    <div class="results-view" id="resultsView">
        <div class="patient-info">
            <div class="patient-label">Patient Record</div>
            <div class="patient-name" id="resPatientName">--</div>
            <div class="timestamp" id="resTimestamp">--</div>
        </div>

        <div class="vitals-grid">
            <div class="vital-box">
                <div class="vital-box-label">Blood Pressure</div>
                <div class="vital-box-value" id="resBp">--/--</div>
                <span class="vital-box-unit">mmHg</span>
            </div>
            <div class="vital-box">
                <div class="vital-box-label">Blood Sugar</div>
                <div class="vital-box-value" id="resSugar">--</div>
                <span class="vital-box-unit">mg/dL</span>
            </div>
        </div>

        <div class="analysis-section">
            <div class="analysis-title">Clinical Analysis & Advice</div>
            <p class="analysis-text" id="resEvaluation">--</p>
        </div>

        <!-- Matched Doctor Card -->
        <div class="doctor-box">
            <div class="doctor-avatar" id="docAvatar">🩺</div>
            <div class="doctor-details">
                <div class="doctor-badge">Assigned Physician</div>
                <div class="doctor-name" id="docName">Selecting doctor...</div>
                <div class="doctor-meta">
                    <span id="docSpecialty">General Practitioner</span>
                    <span id="docLocation"></span>
                </div>
            </div>
        </div>

        <div class="booking-status" id="bookingStatus"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="btnBookAppointment">
                <span class="btn-spinner" id="bookSpinner"></span>
                <span id="bookBtnText">Confirm Doctor Booking</span>
            </button>
            <button class="btn btn-secondary" id="btnNewReading">New Reading</button>
        </div>
    </div>
</div>

<script>

    const EMAIL_API_URL        = "https://api.presibo.com/email/index.php";
    const POLL_INTERVAL        = 3000;

    const fallbackData = {"doctors": [
      {"id": 1, "firstname": "Sopuru", "lastname": "Akandu", "specialization": "General Practitioner", "location":"Abuja"},

      {"id": 20, "firstname": "Vincent", "lastname": "Ugwu", "specialization": "General Practitioner", "location":"Port Harcourt"},
      {"id": 21, "firstname": "Busayo", "midname": "Felicia", "lastname": "Afolabi", "specialization": "General Practitioner", "location":"Abuja"},
      {"id": 22, "firstname": "Henrietta", "midname": "Eseoghene", "lastname": "Afolabi", "specialization": "General Practitioner", "location":"Abuja"},
      {"id": 23, "firstname": "Ebai", "midname": "Romanus", "lastname": "Ashu", "specialization": "General Practitioner", "location":"Abuja"},
      {"id": 24, "firstname": "Hajara", "midname": "Dalhatu", "lastname": "Musa", "specialization": "General Practitioner", "location":"Abuja"},

    ]};

    let doctorsList = fallbackData.doctors;
    let pollTimer = null;
    let initialLastRecordId = null;

    let currentPatientRecord = null;
    let currentMatchedDoctor = null;

    const scanView           = document.getElementById('scanView');
    const resultsView        = document.getElementById('resultsView');
    const statusDot          = document.getElementById('statusDot');
    const statusText         = document.getElementById('statusText');
    const btnNewReading      = document.getElementById('btnNewReading');
    const btnBookAppointment = document.getElementById('btnBookAppointment');
    const bookSpinner        = document.getElementById('bookSpinner');
    const bookBtnText        = document.getElementById('bookBtnText');
    const bookingStatus      = document.getElementById('bookingStatus');

    const resPatientName     = document.getElementById('resPatientName');
    const resTimestamp       = document.getElementById('resTimestamp');
    const resBp              = document.getElementById('resBp');
    const resSugar           = document.getElementById('resSugar');
    const resEvaluation      = document.getElementById('resEvaluation');

    const docName            = document.getElementById('docName');
    const docSpecialty       = document.getElementById('docSpecialty');
    const docLocation        = document.getElementById('docLocation');
    const docAvatar          = document.getElementById('docAvatar');

    function setStatus(text, stateClass) {
        statusText.innerText = text;
        statusDot.className = 'status-dot ' + (stateClass || '');
    }

    async function loadDoctors() {
        try {
            const res = await fetch(DOCTORS_API_URL, { cache: "no-store" });
            if (res.ok) {
                const data = await res.json();
                const fetched = Array.isArray(data) ? data : (data.doctors || []);
                if (fetched.length > 0) doctorsList = fetched;
            }
        } catch (err) {
            console.log("Using built-in doctors fallback roster.");
        }
    }

    function pairDoctor() {
        if (!doctorsList || doctorsList.length === 0) return;

        const randomIndex = Math.floor(Math.random() * doctorsList.length);
        const matched = doctorsList[randomIndex];

        currentMatchedDoctor = matched;

        const names = [matched.firstname, matched.midname, matched.lastname].filter(Boolean).join(' ');
        const fullName = names.startsWith('Dr.') ? names : `Dr. ${names}`;

        docName.innerText = fullName;
        docSpecialty.innerText = matched.specialization || matched.specialty || 'General Practitioner';
        docLocation.innerText = `• ${matched.location || 'Nigeria'}`;

        const initials = `${(matched.firstname || '')[0] || ''}${(matched.lastname || '')[0] || ''}`.toUpperCase();
        docAvatar.innerText = initials || '🩺';
    }

    // Consolidated email: Vitals + Clinical Evaluation + Confirmed Appointment Date & Time
    async function sendCombinedReportEmail(record, doctor, apptDate, apptTime) {
        const recipientEmail = record.email || '';
        if (!recipientEmail || recipientEmail.trim() === '') return;

        const patientName = `${record.first_name || 'Patient'} ${record.last_name || ''}`.trim();
        const docFullName = [doctor.firstname, doctor.midname, doctor.lastname].filter(Boolean).join(' ');
        const formattedDocName = docFullName.startsWith('Dr.') ? docFullName : `Dr. ${docFullName}`;
        const sugarText = record.sugar ? `${record.sugar} mg/dL` : 'Not recorded';

        const emailMessageHtml = `
            <p>Dear <strong>${patientName}</strong>,</p>
            <p>Your vital signs have been evaluated and your consultation appointment is confirmed.</p>
            
            <h3 style="color: #2563eb; margin: 20px 0 10px 0; font-size: 16px;">1. Vital Signs Reading</h3>
            <table style="width: 100%; border-collapse: collapse; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px;">
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Blood Pressure:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;">${record.bp_sys}/${record.bp_dia} mmHg</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;"><strong>Blood Sugar:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #e2e8f0;">${sugarText}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px;"><strong>Reading Recorded:</strong></td>
                    <td style="padding: 10px 14px;">${record.datetime || 'Just now'}</td>
                </tr>
            </table>

            <h3 style="color: #2563eb; margin: 20px 0 10px 0; font-size: 16px;">2. Clinical Analysis &amp; Advice</h3>
            <div style="background: #eff6ff; border-left: 4px solid #2563eb; padding: 14px; margin-bottom: 20px; border-radius: 4px;">
                <p style="margin: 0; color: #1e3a8a; line-height: 1.5;">${record.evaluation || 'No clinical observations logged.'}</p>
            </div>

            <h3 style="color: #16a34a; margin: 20px 0 10px 0; font-size: 16px;">3. Confirmed Appointment Details</h3>
            <table style="width: 100%; border-collapse: collapse; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; margin-bottom: 20px;">
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;"><strong>Assigned Doctor:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0; font-weight: bold; color: #14532d;">${formattedDocName}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;"><strong>Specialty:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;">${doctor.specialization || doctor.specialty || 'General Practitioner'}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;"><strong>Location:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;">${doctor.location || 'Virtual Clinic'}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0;"><strong>Appointment Date:</strong></td>
                    <td style="padding: 10px 14px; border-bottom: 1px solid #bbf7d0; font-weight: bold;">${apptDate}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 14px;"><strong>Appointment Time:</strong></td>
                    <td style="padding: 10px 14px; font-weight: bold;">${apptTime}</td>
                </tr>
            </table>

            <p style="margin-top: 15px;">Please be ready 10 minutes before your scheduled appointment time. If you need any assistance, reach us at support@presibo.com.</p>
        `;

        const emailPayload = {
            action: "send",
            type: "custom",
            email: recipientEmail,
            name: patientName,
            title: `Presibo Health - Vitals Evaluation & Appointment Confirmation`,
            message: emailMessageHtml
        };

        fetch(EMAIL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(emailPayload)
        }).catch(() => {});
    }

    async function fetchLatestRecord() {
        try {
            const response = await fetch(DEVICES_API_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("Network response was not OK");
            
            const result = await response.json();
            if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                return result.data[0];
            }
            return null;
        } catch (err) {
            console.error("API Read Error:", err);
            return null;
        }
    }

    function renderRecord(record) {
        currentPatientRecord = record;

        resPatientName.innerText = `${record.first_name || 'Patient'} ${record.last_name || ''}`.trim();
        resTimestamp.innerText = `Recorded: ${record.datetime || 'Just now'}`;
        resBp.innerText = `${record.bp_sys || '--'}/${record.bp_dia || '--'}`;
        resSugar.innerText = record.sugar ? `${record.sugar}` : 'N/A';
        resEvaluation.innerText = record.evaluation || 'Vital signs logged successfully.';

        pairDoctor();

        bookingStatus.className = 'booking-status';
        bookingStatus.innerText = '';
        btnBookAppointment.disabled = false;
        bookBtnText.innerText = 'Confirm Doctor Booking';
        bookSpinner.style.display = 'none';

        scanView.style.display = 'none';
        resultsView.style.display = 'block';
        setStatus("Reading Complete", "ready");
    }

    async function bookAppointment() {
        if (!currentPatientRecord || !currentMatchedDoctor) return;

        btnBookAppointment.disabled = true;
        bookSpinner.style.display = 'inline-block';
        bookBtnText.innerText = 'Processing Booking...';
        bookingStatus.className = 'booking-status';

        const now = new Date();
        const apptDate = now.toISOString().slice(0, 10);
        const apptTime = now.toTimeString().slice(0, 8);

        const patientFullName = `${currentPatientRecord.first_name || ''} ${currentPatientRecord.last_name || ''}`.trim() || 'Patient';
        const docFullName = [currentMatchedDoctor.firstname, currentMatchedDoctor.midname, currentMatchedDoctor.lastname].filter(Boolean).join(' ');
        const formattedDocName = docFullName.startsWith('Dr.') ? docFullName : `Dr. ${docFullName}`;
        
        const reasonText = `Device Reading: BP ${currentPatientRecord.bp_sys}/${currentPatientRecord.bp_dia} mmHg, Sugar: ${currentPatientRecord.sugar || 'N/A'} mg/dL. Evaluation: ${currentPatientRecord.evaluation || 'None'}`;

        const appointmentPayload = {
            name: patientFullName,
            email: currentPatientRecord.email || 'patient@presibo.com',
            phone: currentPatientRecord.phone || '',
            date: apptDate,
            time: apptTime,
            doctor_id: String(currentMatchedDoctor.id || ''),
            doctor: formattedDocName,
            specialty: currentMatchedDoctor.specialization || currentMatchedDoctor.specialty || 'General Practitioner',
            location: currentMatchedDoctor.location || 'Virtual Clinic',
            description: reasonText
        };

        try {
            const response = await fetch(APPOINTMENTS_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(appointmentPayload)
            });

            const resData = await response.json();

            if (response.ok && (resData.status === 'success' || resData.success)) {
                // Dispatch complete results + appointment date & time email
                sendCombinedReportEmail(currentPatientRecord, currentMatchedDoctor, apptDate, apptTime);

                bookingStatus.className = 'booking-status success';
                bookingStatus.innerHTML = `✓ Appointment Confirmed for <strong>${apptDate} at ${apptTime}</strong>.<br>Full report & confirmation sent to your email.`;
                bookBtnText.innerText = 'Booking Confirmed';
            } else {
                throw new Error(resData.message || 'Failed to complete appointment booking.');
            }
        } catch (err) {
            bookingStatus.className = 'booking-status error';
            bookingStatus.innerText = `Error: ${err.message || 'Booking failed. Try again.'}`;
            btnBookAppointment.disabled = false;
            bookBtnText.innerText = 'Retry Doctor Booking';
        } finally {
            bookSpinner.style.display = 'none';
        }
    }

    async function startScan() {
        clearInterval(pollTimer);
        
        resultsView.style.display = 'none';
        scanView.style.display = 'flex';
        setStatus("Scanning...", "scanning");

        const currentRecord = await fetchLatestRecord();
        initialLastRecordId = currentRecord ? currentRecord.id : null;

        pollTimer = setInterval(async () => {
            const latest = await fetchLatestRecord();
            if (latest && (!initialLastRecordId || latest.id !== initialLastRecordId)) {
                clearInterval(pollTimer);
                renderRecord(latest);
            }
        }, POLL_INTERVAL);
    }

    btnBookAppointment.addEventListener('click', bookAppointment);
    btnNewReading.addEventListener('click', startScan);

    window.addEventListener('DOMContentLoaded', async () => {
        await loadDoctors();
        startScan();
    });
</script>

</body>
</html>
